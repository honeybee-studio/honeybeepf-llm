[package]
name = "honeybeepf-llm"
version = "0.1.0"
edition.workspace = true

license.workspace = true

[features]
default = []
k8s = ["dep:kube", "dep:k8s-openapi", "dep:futures"]

[dependencies]
honeybeepf-llm-common = { path = "../honeybeepf-llm-common", features = ["user"] }
honeybeepf-llm-core = { path = "../honeybeepf-llm-core" }

anyhow = { workspace = true, default-features = true }
aya = { workspace = true }
aya-log = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
object = { version = "0.36", default-features = false, features = ["elf", "read_core", "std"] }
tokio = { workspace = true, features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "net",
    "signal",
    "sync",
    "time",
] }
clap = { workspace = true, features = ["derive", "env"] }
config = { version = "0.14", features = ["yaml"] }
dotenvy = "0.15"
serde = { workspace = true }
serde_json = { workspace = true }
httparse = "1.10"
once_cell = "1.21"
flate2 = "1.1"
brotli-decompressor = "6.1"
ruzstd = { version = "0.9", default-features = false, features = ["std"] }
procfs = "0.18"
regex = "1"
tracing-subscriber.workspace = true

# OpenTelemetry dependencies for metrics export
opentelemetry = { version = "0.27", features = ["metrics"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio", "metrics"] }
opentelemetry-otlp = { version = "0.27", features = ["metrics", "grpc-tonic"] }

# Kubernetes pod resolution (optional, behind "k8s" feature)
kube = { version = "0.98", features = ["runtime", "client", "derive"], optional = true }
k8s-openapi = { version = "0.24", features = ["v1_32"], optional = true }
futures = { version = "0.3", optional = true }

[dev-dependencies]
serial_test = "3.2.0"

[build-dependencies]
# Not used by build.rs; a change here or in honeybeepf-llm-common reruns build.rs, rebuilding the eBPF object.
honeybeepf-llm-ebpf = { path = "../honeybeepf-llm-ebpf" }

[[bin]]
name = "honeybeepf-llm"
path = "src/main.rs"
