[package]
name = "honeybeepf-llm"
version = "0.3.2"
edition.workspace = true

license.workspace = true

[features]
default = []
k8s = ["dep:kube", "dep:k8s-openapi", "dep:futures"]

[dependencies]
honeybeepf-llm-common = { path = "../honeybeepf-llm-common", features = ["user"] }
honeybeepf-llm-core = { path = "../honeybeepf-llm-core" }

anyhow = { workspace = true, default-features = true }
arc-swap = "1.7"
aya = { workspace = true }
aya-log = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
object = { version = "0.36", default-features = false, features = ["elf", "read_core", "std"] }
# Finds the return instructions in Go functions, where the Go TLS probes read results.
iced-x86 = { version = "1.21", default-features = false, features = ["decoder", "std"] }
tokio = { workspace = true, features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "net",
    "signal",
    "sync",
    "time",
] }
clap = { workspace = true, features = ["derive", "env"] }
config = { version = "0.14", features = ["yaml"] }
dotenvy = "0.15"
serde = { workspace = true }
serde_json = { workspace = true }
httparse = "1.10"
once_cell = "1.21"
flate2 = "1.1"
brotli-decompressor = "6.1"
ruzstd = { version = "0.9", default-features = false, features = ["std"] }
# Without chrono and flate2: only the process list and memory maps are read.
procfs = { version = "0.18", default-features = false }
regex = "1"
tracing-subscriber.workspace = true
# Audit events carry named fields, which the log crate cannot.
tracing = "0.1"

# OpenTelemetry dependencies for metrics export
# Metrics over gRPC only: the defaults would add traces, logs and an HTTP exporter with reqwest.
opentelemetry = { version = "0.33", default-features = false, features = ["metrics", "internal-logs"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["rt-tokio", "metrics", "internal-logs"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["metrics", "grpc-tonic", "tls-ring", "tls-roots", "internal-logs"] }
# TLS settings for the OTLP exporter (same tonic as opentelemetry-otlp)
tonic = { version = "0.14", default-features = false, features = ["tls-ring", "tls-native-roots"] }

# Kubernetes pod resolution (optional, behind "k8s" feature)
kube = { version = "5.1", features = ["runtime", "client", "derive"], optional = true }
k8s-openapi = { version = "0.29", features = ["v1_33"], optional = true }
futures = { version = "0.3", optional = true }

[dev-dependencies]
serial_test = "4.0.1"
# Tests read metrics through a manual reader, which the SDK only exports behind this feature.
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["experimental_metrics_custom_reader"] }

[build-dependencies]
# Not used by build.rs; a change here or in honeybeepf-llm-common reruns build.rs, rebuilding the eBPF object.
honeybeepf-llm-ebpf = { path = "../honeybeepf-llm-ebpf" }

[[bin]]
name = "honeybeepf-llm"
path = "src/main.rs"
