site_name: honeybeepf-llm
site_description: LLM token usage and cost per Kubernetes namespace, pod and model, from eBPF.
site_url: https://honeybee-studio.github.io/honeybeepf-llm/
repo_url: https://github.com/honeybee-studio/honeybeepf-llm
repo_name: honeybee-studio/honeybeepf-llm
edit_uri: edit/main/docs/
docs_dir: docs
# Pins for the docs build in CI, not pages.
exclude_docs: |
  requirements.in
  requirements.txt
copyright: Apache License 2.0

theme:
  name: material
  # Adds the link-preview image and tags for shared links.
  custom_dir: overrides
  logo: assets/favicon.svg
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/live.js

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/honeybee-studio/honeybeepf-llm
      name: honeybeepf-llm on GitHub


plugins:
  - search
  # Translated pages are <page>.<locale>.md next to the English one; a page without one falls back to English.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ko
          name: 한국어
          build: true
          nav_translations:
            Home: 홈
            Get started: 시작하기
            Quickstart: 빠른 시작
            Install: 설치
            Concepts: 개념
            How it works: 동작 원리
            Cost and prices: 비용과 가격
            Guides: 가이드
            Reference: 참고
            Operations: 운영
            FAQ: 자주 묻는 질문
        - locale: zh
          name: 简体中文
          build: true
          nav_translations:
            Home: 首页
            Get started: 开始使用
            Quickstart: 快速开始
            Install: 安装
            Concepts: 概念
            How it works: 工作原理
            Cost and prices: 成本与价格
            Guides: 指南
            Reference: 参考
            Operations: 运维
            FAQ: 常见问题
        - locale: ja
          name: 日本語
          build: true
          nav_translations:
            Home: ホーム
            Get started: はじめに
            Quickstart: クイックスタート
            Install: インストール
            Concepts: 概念
            How it works: 仕組み
            Cost and prices: コストと価格
            Guides: ガイド
            Reference: リファレンス
            Operations: 運用
            FAQ: よくある質問
        - locale: es
          name: Español
          build: true
          nav_translations:
            Home: Inicio
            Get started: Primeros pasos
            Quickstart: Inicio rápido
            Install: Instalación
            Concepts: Conceptos
            How it works: Cómo funciona
            Cost and prices: Costos y precios
            Guides: Guías
            Reference: Referencia
            Operations: Operación
            FAQ: Preguntas frecuentes
        - locale: pt-BR
          name: Português (Brasil)
          build: true
          nav_translations:
            Home: Início
            Get started: Primeiros passos
            Quickstart: Início rápido
            Install: Instalação
            Concepts: Conceitos
            How it works: Como funciona
            Cost and prices: Custos e preços
            Guides: Guias
            Reference: Referência
            Operations: Operação
            FAQ: Perguntas frequentes
        - locale: de
          name: Deutsch
          build: true
          nav_translations:
            Home: Start
            Get started: Erste Schritte
            Quickstart: Schnellstart
            Install: Installation
            Concepts: Konzepte
            How it works: Funktionsweise
            Cost and prices: Kosten und Preise
            Guides: Anleitungen
            Reference: Referenz
            Operations: Betrieb
            FAQ: FAQ

markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

# With --strict, a link to a missing page or heading fails the build.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Get started:
      - Quickstart: quickstart.md
      - Try the demo: demo.md
      - Install: install.md
      - Verify the image, chart and binaries: verify.md
      - Build from source: build.md
      - Run without Kubernetes: run-binary.md
  - Concepts:
      - How it works: how-it-works.md
      - What is supported: providers.md
      - Cost and prices: cost.md
  - Guides:
      - Find the workloads that are not seen: guides/coverage.md
      - Add a provider: guides/custom-providers.md
      - Add your own prices: guides/prices.md
      - Self-hosted models over plain HTTP: guides/plaintext.md
      - Detect unlisted hosts by shape: guides/detect-by-shape.md
      - Programs with built-in TLS: guides/built-in-tls.md
      - Compare workload variants: guides/pod-labels.md
      - Record only some namespaces: guides/namespace-scope.md
      - Logs and audit events: guides/logs.md
      - Budgets and alerts: alerts.md
      - Grafana dashboards: grafana/README.md
  - Reference:
      - Metrics: metrics.md
      - Helm values: reference-values.md
      - Experimental features: experimental.md
  - Operations:
      - Overhead benchmark: benchmark.md
      - Security review: security-review.md
      - Troubleshooting: troubleshooting.md
      - FAQ: faq.md
