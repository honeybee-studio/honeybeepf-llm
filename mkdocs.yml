site_name: honeybeepf-llm
site_description: LLM token usage and cost per Kubernetes namespace, pod and model, from eBPF.
site_url: https://honeybee-studio.github.io/honeybeepf-llm/
repo_url: https://github.com/honeybee-studio/honeybeepf-llm
repo_name: honeybee-studio/honeybeepf-llm
edit_uri: edit/main/docs/
docs_dir: docs
# Pins for the docs build in CI, not a page.
exclude_docs: requirements.txt
copyright: Apache License 2.0

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: amber
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: amber
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

# With --strict, a link to a missing page or heading fails the build.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Get started:
      - Install: install.md
      - What is supported: providers.md
  - Reference:
      - Metrics: metrics.md
      - Alerts: alerts.md
      - Grafana dashboards: grafana/README.md
  - Operations:
      - Overhead benchmark: benchmark.md
      - Security review: security-review.md
