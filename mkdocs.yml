site_name: honeybeepf-llm
site_description: LLM token usage and cost per Kubernetes namespace, pod and model, from eBPF.
site_url: https://honeybee-studio.github.io/honeybeepf-llm/
repo_url: https://github.com/honeybee-studio/honeybeepf-llm
repo_name: honeybee-studio/honeybeepf-llm
edit_uri: edit/main/docs/
docs_dir: docs
# Pins for the docs build in CI, not a page.
exclude_docs: requirements.txt
copyright: Apache License 2.0

theme:
  name: material
  # Adds the link-preview image and tags for shared links.
  custom_dir: overrides
  logo: assets/favicon.svg
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - navigation.top
    - navigation.instant
    - toc.follow
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/live.js

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/honeybee-studio/honeybeepf-llm
      name: honeybeepf-llm on GitHub

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

# With --strict, a link to a missing page or heading fails the build.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Get started:
      - Install: install.md
      - What is supported: providers.md
  - Reference:
      - Metrics: metrics.md
      - Alerts: alerts.md
      - Grafana dashboards: grafana/README.md
  - Operations:
      - Overhead benchmark: benchmark.md
      - Security review: security-review.md
