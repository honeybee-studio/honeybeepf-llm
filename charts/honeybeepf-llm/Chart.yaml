apiVersion: v2
name: honeybeepf-llm
description: Count LLM API tokens and USD cost per Kubernetes pod and workload with eBPF, with no gateway or SDK
type: application
version: 0.4.0
appVersion: "0.4.0"
keywords:
  - llm
  - finops
  - cost
  - tokens
  - openai
  - anthropic
  - gemini
  - bedrock
  - ebpf
  - opentelemetry
  - observability
home: https://github.com/honeybee-studio/honeybeepf-llm
# The first source becomes the OCI source annotation, which links the ghcr chart package to this repository.
sources:
  - https://github.com/honeybee-studio/honeybeepf-llm

maintainers:
  - name: sammiee5311
    url: https://github.com/sammiee5311
  - name: jundorok
    url: https://github.com/jundorok
annotations:
  artifacthub.io/category: monitoring-logging
  # Shown per version on Artifact Hub; rewrite both for each release.
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/changes: |
    - kind: added
      description: Go executables are probed through crypto/tls, so LLM calls from Go services are recorded
    - kind: added
      description: 18 more hosted OpenAI-compatible providers recorded with no configuration
    - kind: added
      description: Alert rules for spend, budgets and capture health (alerts.prometheusRule.enabled)
    - kind: added
      description: logFormat json and audit events of what the agent attached to and loaded
    - kind: changed
      description: The image is Chainguard glibc-dynamic with no shell; probes run honeybeepf-llm --check-heartbeat
    - kind: fixed
      description: Kubernetes API traffic no longer counts as headers_lost unparsed LLM calls
    - kind: removed
      description: The file-access and process-lifecycle probes and their metrics
    - kind: security
      description: OpenTelemetry 0.33 (GHSA-w9wp-h8wv-79jx) and an image with no known vulnerabilities
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Documentation
      url: https://honeybee-studio.github.io/honeybeepf-llm/
    - name: Install guide
      url: https://honeybee-studio.github.io/honeybeepf-llm/install/
    - name: Overhead benchmark
      url: https://honeybee-studio.github.io/honeybeepf-llm/benchmark/
    - name: Security review
      url: https://honeybee-studio.github.io/honeybeepf-llm/security-review/
