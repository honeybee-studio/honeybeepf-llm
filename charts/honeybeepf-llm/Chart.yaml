apiVersion: v2
name: honeybeepf-llm
description: Count LLM API tokens and USD cost per Kubernetes pod and workload with eBPF, with no gateway or SDK
type: application
version: 0.5.0
appVersion: "0.5.0"
keywords:
  - llm
  - finops
  - cost
  - tokens
  - openai
  - anthropic
  - gemini
  - bedrock
  - ebpf
  - opentelemetry
  - observability
home: https://github.com/honeybee-studio/honeybeepf-llm
# The first source becomes the OCI source annotation, which links the ghcr chart package to this repository.
sources:
  - https://github.com/honeybee-studio/honeybeepf-llm

maintainers:
  - name: sammiee5311
    url: https://github.com/sammiee5311
  - name: jundorok
    url: https://github.com/jundorok
annotations:
  artifacthub.io/category: monitoring-logging
  # Shown per version on Artifact Hub; rewrite both for each release.
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/changes: |
    - kind: added
      description: OpenAI Realtime and Responses calls over WebSocket, compressed or not (Codex included), are recorded with no configuration
    - kind: added
      description: Prices for the OpenAI Realtime and audio models, cached audio included
    - kind: added
      description: builtinProbes.llm.namespaces records only the pods of the listed namespaces, checked in the kernel
    - kind: added
      description: Calls to a provider set as a gateway (gateway true) carry hop="gateway", so totals count a call through a gateway once
    - kind: added
      description: Experimental builtinProbes.llm.aead records programs with a built-in BoringSSL or aws-lc, such as Claude Code
    - kind: added
      description: A failed LLM call logs its HTTP status
    - kind: fixed
      description: Executables replaced or removed after their process started, as after an update, are still probed
    - kind: fixed
      description: A version-named executable, such as Claude Code's versions/<n>, is matched by its program folder
    - kind: security
      description: kube 5.2 for RUSTSEC-2026-0600; the agent's rustls build was not affected
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Documentation
      url: https://honeybee-studio.github.io/honeybeepf-llm/
    - name: Install guide
      url: https://honeybee-studio.github.io/honeybeepf-llm/install/
    - name: Overhead benchmark
      url: https://honeybee-studio.github.io/honeybeepf-llm/benchmark/
    - name: Security review
      url: https://honeybee-studio.github.io/honeybeepf-llm/security-review/
