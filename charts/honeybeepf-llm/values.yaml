nameOverride: ""
fullnameOverride: ""

image:
  repository: "ghcr.io/honeybee-studio/honeybeepf-llm"
  tag: "latest"
  pullPolicy: Always
imagePullSecrets: [] 
podAnnotations: {}

output:
  otlp:
    endpoint: ""
    collectorReleaseName: "honeybeepf-llm-otel-collector"
    port: 4317
    protocol: "grpc"

serviceAccount:
  create: true
  annotations: {}
  name: ""

rustLog: "info"

builtinProbes:
  filesystem:
    file_access:
      enabled: false
      watched_paths:
        # SSH keys - common user paths
        - "/root/.ssh/authorized_keys"
        - "/root/.ssh/id_rsa"
        - "/root/.ssh/id_ed25519"
        - "/home/ubuntu/.ssh/authorized_keys"
        - "/home/ubuntu/.ssh/id_rsa"
        - "/home/ubuntu/.ssh/id_ed25519"
        - "/home/root/.ssh/authorized_keys"
        - "/home/root/.ssh/id_rsa"
        - "/home/root/.ssh/id_ed25519"

  llm:
    enabled: false
    # Also probe executables with OpenSSL built in (official Node.js builds, node: images).
    executables: true
    # Custom providers config (optional). Built-in: OpenAI, Anthropic, Gemini (also via Azure, Bedrock, Vertex AI)
    # Add your own providers here (e.g. Ollama, vLLM, private models); a built-in name replaces every built-in entry of that name.
    providers: []
    # Example:
    # providers:
    #   - name: "ollama"
    #     hosts: ["localhost", "ollama.internal"]  # substring match; one "*" must cover the whole host (e.g. "llm.*.internal")
    #     paths: ["/api/generate", "/api/chat"]  # substring match; a trailing "$" anchors the end (query and one trailing "/" ignored)
    #     response:
    #       usage_path: "usage"               # JSON path to usage object
    #       prompt_tokens: "prompt_eval_count" # Field name for input tokens
    #       completion_tokens: "eval_count"    # Field name for output tokens
    #       model_path: "model"
    #     request_extractor: "messages"       # How to extract prompt text (messages, contents, prompt, input)
    # Price overrides (optional), in the format of honeybeepf-llm-core/src/prices.json, merged per model.
    # "price_multiplier" multiplies the provider's built-in prices (0.8 = pay 80%), not models listed here.
    # A rejected file is logged and ignored. Prices are read at startup: restart the DaemonSet.
    prices: {}
    # Example (USD per million tokens):
    # prices:
    #   version: "acme-2026-10"
    #   providers:
    #     - name: "openai"
    #       source: "our contract"
    #       checked: "2026-10-01"
    #       price_multiplier: 0.8
    #       models:
    #         gpt-5: {input: 1.0, output: 8.0, cache_read: 0.1}
    #     - name: "vllm"
    #       source: "internal"
    #       checked: "2026-10-01"
    #       models:
    #         my-vllm-llama: {input: 0.1, output: 0.2}

  interval: 1000

  process_lifecycle:
    enabled: false

customProbes:
  kprobes: []
  uprobes: []
  tracepoints: []

securityContext:
  readOnlyRootFilesystem: true
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop:
      - ALL
    add:
      - BPF         # load eBPF programs and maps
      - PERFMON     # uprobe/tracepoint/fentry attach and bpf_probe_read_user
      - SYS_ADMIN   # uprobe perf_event_open: Ubuntu 7.0 denies it with PERFMON alone (EACCES at paranoid 2-4; https://bugs.launchpad.net/ubuntu/+source/linux/+bug/2131046)
      - SYS_PTRACE  # cross-pod /proc access for libssl discovery (blocked by container LSM profiles + yama on all major K8s distros)

resources:
  limits:
    cpu: "1000m"
    memory: "1Gi"
  requests:
    cpu: "200m"
    memory: "512Mi"

nodeSelector:
  kubernetes.io/os: linux
tolerations: []

debug: false
