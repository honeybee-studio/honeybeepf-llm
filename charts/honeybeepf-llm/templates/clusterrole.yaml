{{- if .Values.serviceAccount.create -}}
{{- $plaintext := false -}}
{{- range .Values.builtinProbes.llm.providers -}}
  {{- if .plaintext }}{{- $plaintext = true }}{{- end -}}
{{- end -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "honeybeepf-llm.fullname" . }}
  labels:
    {{- include "honeybeepf-llm.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Pods only reference their Job; the agent reads the Job to find its CronJob.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get"]
{{- if $plaintext }}
  # Plaintext capture resolves a configured provider's in-cluster hosts to Service ClusterIPs and
  # ready pod IPs; granted only when a provider sets `plaintext`.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
{{- end }}
{{- end }}
