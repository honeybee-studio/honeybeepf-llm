{{- if .Values.serviceAccount.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "honeybeepf-llm.fullname" . }}
  labels:
    {{- include "honeybeepf-llm.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Pods only reference their Job; the agent reads the Job to find its CronJob.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get"]
{{- end }}
