apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "honeybeepf-llm.fullname" . }}
  labels:
    {{- include "honeybeepf-llm.labels" . | nindent 4 }}
data:
  RUST_LOG: {{ .Values.rustLog | quote }}
  LOG_FORMAT: {{ .Values.logFormat | default "text" | quote }}
  DEBUG: {{ .Values.debug | quote }}
  {{- if .Values.output.otlp.endpoint }}
  {{- $otlpEndpoint := .Values.output.otlp.endpoint -}}
  {{- if or (hasPrefix "http://" $otlpEndpoint) (hasPrefix "https://" $otlpEndpoint) }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ $otlpEndpoint | quote }}
  {{- else }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ printf "http://%s" $otlpEndpoint | quote }}
  {{- end }}
  OTEL_SERVICE_NAME: "honeybeepf-llm"
  {{- end }}

  # === LLM Probes ===
  BUILTIN_PROBES__LLM: {{ .Values.builtinProbes.llm.enabled | quote }}
  {{- if not (kindIs "invalid" .Values.builtinProbes.llm.executables) }}
  BUILTIN_PROBES__LLM_EXECUTABLES: {{ .Values.builtinProbes.llm.executables | quote }}
  {{- end }}
  {{- if not (kindIs "invalid" .Values.builtinProbes.llm.detectByShape) }}
  BUILTIN_PROBES__LLM_DETECT_BY_SHAPE: {{ .Values.builtinProbes.llm.detectByShape | quote }}
  {{- end }}
  {{- if not (kindIs "invalid" .Values.builtinProbes.llm.aead) }}
  BUILTIN_PROBES__LLM_AEAD: {{ .Values.builtinProbes.llm.aead | quote }}
  {{- end }}
  {{- if .Values.builtinProbes.llm.aeadExecutables }}
  BUILTIN_PROBES__LLM_AEAD_EXECUTABLES: {{ .Values.builtinProbes.llm.aeadExecutables | join "," | quote }}
  {{- end }}
  {{- if .Values.builtinProbes.llm.namespaces }}
  BUILTIN_PROBES__LLM_NAMESPACES: {{ .Values.builtinProbes.llm.namespaces | join "," | quote }}
  {{- end }}
  {{- if .Values.builtinProbes.llm.podLabels }}
  BUILTIN_PROBES__LLM_POD_LABELS: {{ .Values.builtinProbes.llm.podLabels | join "," | quote }}
  {{- end }}
  {{- if .Values.builtinProbes.llm.providers }}
  LLM_PROVIDERS_CONFIG: {{ dict "providers" .Values.builtinProbes.llm.providers | toJson | quote }}
  {{- end }}
  {{- if .Values.builtinProbes.llm.prices }}
  LLM_PRICES_CONFIG: {{ .Values.builtinProbes.llm.prices | toJson | quote }}
  {{- end }}

