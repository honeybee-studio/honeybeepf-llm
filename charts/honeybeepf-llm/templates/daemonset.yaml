apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "honeybeepf-llm.fullname" . }}
  labels:
    {{- include "honeybeepf-llm.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "honeybeepf-llm.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      annotations:
        # envFrom config is read once at container start, so roll pods when it changes; a plain
        # helm upgrade touches only the ConfigMap otherwise. Prices hot-reload from their mount, so drop them.
        checksum/config: {{ regexReplaceAll "LLM_PRICES_CONFIG:.*" (include (print $.Template.BasePath "/configmap.yaml") .) "" | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.securityContext.appArmorProfile }}
        {{- if not (semverCompare ">=1.30-0" $.Capabilities.KubeVersion.Version) }}
        container.apparmor.security.beta.kubernetes.io/{{ $.Chart.Name }}: {{ if eq .type "Localhost" }}localhost/{{ .localhostProfile }}{{ else if eq .type "RuntimeDefault" }}runtime/default{{ else }}unconfined{{ end }}
        {{- end }}
        {{- end }}
      labels:
        {{- include "honeybeepf-llm.selectorLabels" . | nindent 8 }}
    spec:
      # Support for private registry image pull secrets
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      
      serviceAccountName: {{ include "honeybeepf-llm.serviceAccountName" . }}
      # /proc/<pid> of other pods: libssl discovery and pod attribution
      hostPID: true

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- $field := semverCompare ">=1.30-0" .Capabilities.KubeVersion.Version }}
            {{- toYaml (ternary .Values.securityContext (omit .Values.securityContext "appArmorProfile") $field) | nindent 12 }}
            {{- if .Values.debug }}
            seLinuxOptions:
              type: "spc_t"
            {{- end }}

          # The agent rewrites the heartbeat every 10 s only while its ring readers and discovery loop keep
          # turning, so a stale file means a hung agent. Startup allows up to 5 minutes for the BPF load and attach.
          startupProbe:
            exec:
              command: ["test", "-f", "/run/honeybeepf/heartbeat"]
            periodSeconds: 5
            # The default 1 s timeout can expire on a busy node before the shell even starts.
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["sh", "-c", "[ $(( $(date +%s) - $(stat -c %Y /run/honeybeepf/heartbeat) )) -lt 60 ]"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["sh", "-c", "[ $(( $(date +%s) - $(stat -c %Y /run/honeybeepf/heartbeat) )) -lt 60 ]"]
            periodSeconds: 15
            timeoutSeconds: 5
          env:
            {{- with .Values.output.otlp.headersSecret }}
            {{- if .name }}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key }}
            {{- end }}
            {{- end }}
            {{- if .Values.output.otlp.caSecret }}
            - name: OTEL_EXPORTER_OTLP_CERTIFICATE
              value: /etc/honeybeepf-llm/otlp-ca/ca.crt
            {{- end }}
            - name: HEARTBEAT_FILE
              value: /run/honeybeepf/heartbeat
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace={{ .Release.Namespace }},deployment.environment={{ .Release.Namespace }},k8s.node.name=$(K8S_NODE_NAME),k8s.pod.name=$(K8S_POD_NAME)"
            {{- if .Values.builtinProbes.llm.prices }}
            # Kubelet refreshes a mounted ConfigMap in place (env does not), so the agent rereads prices without a restart.
            - name: LLM_PRICES_CONFIG_FILE
              value: /etc/honeybeepf-llm/prices/prices.json
            {{- end }}

              
          envFrom:
            - configMapRef:
                name: {{ include "honeybeepf-llm.fullname" . }}

          volumeMounts:
            # tracefs for the exec-watch tracepoint; with neither tracefs path the agent records nothing
            {{- if .Values.output.otlp.caSecret }}
            - mountPath: /etc/honeybeepf-llm/otlp-ca
              name: otlp-ca
              readOnly: true
            {{- end }}
            - mountPath: /run/honeybeepf
              name: heartbeat
            - mountPath: /sys/kernel/tracing
              name: tracefs
              readOnly: true
            # tracefs fallback (debug/tracing) for hosts whose systemd does not mount /sys/kernel/tracing
            - mountPath: /sys/kernel/debug
              name: debugfs
              readOnly: true
            # The host's cgroup tree, for pod attribution and the plaintext attach point. A pod sees only its
            # own cgroup at /sys/fs/cgroup; the rest of the host filesystem is not mounted
            - mountPath: /host/sys/fs/cgroup
              name: host-cgroup
              readOnly: true
            {{- if .Values.builtinProbes.llm.prices }}
            - mountPath: /etc/honeybeepf-llm/prices
              name: prices
              readOnly: true
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- if .Values.output.otlp.caSecret }}
        - name: otlp-ca
          secret:
            secretName: {{ .Values.output.otlp.caSecret }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
        - name: heartbeat
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: tracefs
          hostPath:
            path: /sys/kernel/tracing
            type: Directory
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
            type: Directory
        - name: host-cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        {{- if .Values.builtinProbes.llm.prices }}
        - name: prices
          configMap:
            name: {{ include "honeybeepf-llm.fullname" . }}
            items:
              - key: LLM_PRICES_CONFIG
                path: prices.json
        {{- end }}