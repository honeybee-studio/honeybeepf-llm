apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "honeybeepf-llm.fullname" . }}
  labels:
    {{- include "honeybeepf-llm.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "honeybeepf-llm.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        {{- include "honeybeepf-llm.selectorLabels" . | nindent 8 }}
    spec:
      # Support for private registry image pull secrets
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      
      serviceAccountName: {{ include "honeybeepf-llm.serviceAccountName" . }}
      # /proc/<pid> of other pods: libssl discovery and pod attribution
      hostPID: true

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
            {{- if .Values.debug }}
            seLinuxOptions:
              type: "spc_t"
            {{- end }}

          livenessProbe:
            exec:
              command: ["sh", "-c", "cat /proc/self/status"]
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            exec:
              command: ["sh", "-c", "cat /proc/self/status"]
            initialDelaySeconds: 5
            periodSeconds: 15
          env:
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace={{ .Release.Namespace }},deployment.environment={{ .Release.Namespace }},k8s.node.name=$(K8S_NODE_NAME),k8s.pod.name=$(K8S_POD_NAME)"
            {{- if .Values.builtinProbes.llm.prices }}
            # Kubelet refreshes a mounted ConfigMap in place (env does not), so the agent rereads prices without a restart.
            - name: LLM_PRICES_CONFIG_FILE
              value: /etc/honeybeepf-llm/prices/prices.json
            {{- end }}

              
          envFrom:
            - configMapRef:
                name: {{ include "honeybeepf-llm.fullname" . }}

          volumeMounts:
            # tracefs for the exec-watch tracepoint; with neither tracefs path the agent records nothing
            - mountPath: /sys/kernel/tracing
              name: tracefs
              readOnly: true
            # tracefs fallback (debug/tracing) for hosts whose systemd does not mount /sys/kernel/tracing
            - mountPath: /sys/kernel/debug
              name: debugfs
              readOnly: true
            # Host filesystem for uprobe targets (SSL libraries)
            - mountPath: /host
              name: host-root
              readOnly: true
            {{- if .Values.builtinProbes.llm.prices }}
            - mountPath: /etc/honeybeepf-llm/prices
              name: prices
              readOnly: true
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: tracefs
          hostPath:
            path: /sys/kernel/tracing
            type: Directory
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
            type: Directory
        - name: host-root
          hostPath:
            path: /
            type: Directory
        {{- if .Values.builtinProbes.llm.prices }}
        - name: prices
          configMap:
            name: {{ include "honeybeepf-llm.fullname" . }}
            items:
              - key: LLM_PRICES_CONFIG
                path: prices.json
        {{- end }}