version: 2
updates:
  # Keeps the SHA-pinned actions and their version comments current in one weekly PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # Majors change runtimes and defaults (setup-rust-toolchain v2 broke the eBPF build), so they are reviewed by hand.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - ci
