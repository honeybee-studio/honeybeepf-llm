version: 2
# Version updates come once a month, one grouped PR per ecosystem. Security updates are separate and still
# open as soon as an advisory is published.
updates:
  # The SHA-pinned actions and their version comments.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # Majors change runtimes and defaults (setup-rust-toolchain v2 broke the eBPF build), so they are reviewed by hand.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - ci
  # The digest-pinned base images: the agent's Dockerfile and the benchmark mock server.
  - package-ecosystem: docker
    directories:
      - /
      - /tests/benchmark
    schedule:
      interval: monthly
    groups:
      docker:
        patterns:
          - "*"
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - ci
  # The hash-pinned Python packages: the docs site, the zig that builds release binaries, the benchmark mock.
  - package-ecosystem: pip
    directories:
      - /docs
      - /.github/requirements
      - /tests/benchmark
    schedule:
      interval: monthly
    groups:
      pip:
        patterns:
          - "*"
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - ci
