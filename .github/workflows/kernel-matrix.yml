name: Kernel Matrix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kernel-matrix.yml'
      - 'ci/**'
      - 'honeybeepf-llm/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/kernel-matrix.yml'
      - 'ci/**'
      - 'honeybeepf-llm/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (release)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-04-30
          components: rust-src

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: honeybeepf-llm

      - name: Install bpf-linker
        run: cargo install bpf-linker --locked --version 0.10.3

      - name: Build release
        working-directory: honeybeepf-llm
        run: cargo build --release -p honeybeepf-llm

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: honeybeepf-llm-bin
          path: honeybeepf-llm/target/release/honeybeepf-llm
          if-no-files-found: error
          retention-days: 1

  matrix:
    name: lvh ${{ matrix.kernel }}
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        kernel:
          - '5.10-20261013.143814'
          - '5.15-20261013.143814'
          - '6.1-20261013.143814'
          - '6.6-20261013.143814'
          - '6.12-20261013.143814'
          - '6.18-20261013.143814'
          - '7.2-20261013.143814'
          - 'bpf-next-20261013.143814'
        include:
          - kernel: 'bpf-next-20261013.143814'
            allow-failure: true
    continue-on-error: ${{ matrix.allow-failure == true }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: honeybeepf-llm-bin
          path: ./bin

      - run: chmod +x bin/honeybeepf-llm

      - uses: cilium/little-vm-helper@f86d344aca812dda5aef167867a9a0a90ca6cca5 # v0.0.31
        with:
          test-name: smoke-${{ matrix.kernel }}
          image: 'kind'
          image-version: ${{ matrix.kernel }}
          host-mount: ./
          install-dependencies: 'true'
          cmd: bash /host/ci/smoke.sh
