name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: honeybee-studio/honeybeepf-llm

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check binary file provenance
        run: |
          bash ci/test-check-binary-provenance.sh
          bash ci/check-binary-provenance.sh

      - name: Install Rust toolchain (nightly)
        uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
        with:
          components: rustfmt, clippy, rust-src

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: honeybeepf-llm
          cache-on-failure: true

      - name: Check formatting
        working-directory: honeybeepf-llm
        run: cargo fmt --all -- --check

  core-test:
    name: Core lib
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: honeybeepf-llm
          cache-on-failure: true

      - name: Clippy core crate
        working-directory: honeybeepf-llm
        run: cargo clippy -p honeybeepf-llm-core --all-targets -- -D warnings -W clippy::too_many_lines

      - name: Test core crate
        working-directory: honeybeepf-llm
        run: cargo test -p honeybeepf-llm-core

  build-and-test:
    name: Build (Rust) and sanity-check
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (nightly with rust-src)
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: nightly
          components: rust-src, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm libelf-dev pkg-config build-essential \
            libclang-dev llvm-dev zlib1g-dev

      - name: Install bpf-linker (pinned)
        run: cargo install bpf-linker --version 0.9.15 --locked

      - name: Build eBPF
        working-directory: ./honeybeepf-llm/honeybeepf-llm-ebpf
        run: cargo build --release --target=bpfel-unknown-none -Z build-std=core

      - name: Clippy agent and xtask
        working-directory: ./honeybeepf-llm
        run: cargo +nightly clippy -p honeybeepf-llm -p xtask --features honeybeepf-llm/k8s --all-targets -- -D warnings -W clippy::too_many_lines

      - name: Build userspace
        working-directory: ./honeybeepf-llm/honeybeepf-llm
        run: cargo build --release

      - name: Test agent (k8s feature)
        working-directory: ./honeybeepf-llm
        run: cargo +nightly test --features honeybeepf-llm/k8s

  docker:
    name: Build and publish Docker image
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag PR builds using PR number only (e.g., pr-123)
            type=raw,value=pr-${{ github.event.pull_request.number }},enable=${{ github.event_name == 'pull_request' }}
            # Publish latest only on main
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # Also publish short SHA tag on main merges
            type=sha,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Summary
        run: |
          echo "Images pushed:" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY

  helm:
    name: Publish Helm charts
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Package and push Helm chart
        run: |
          helm package charts/honeybeepf-llm
          helm push honeybeepf-llm-*.tgz oci://ghcr.io/honeybee-studio
          echo "- Pushed honeybeepf-llm" >> $GITHUB_STEP_SUMMARY
