name: Release

on:
  push:
    tags: ['v*.*.*']

env:
  IMAGE: ghcr.io/honeybee-studio/honeybeepf-llm
  # Not oci://ghcr.io/honeybee-studio: helm pushes there as honeybeepf-llm:<version>, the image's own tag.
  CHART_REPO: oci://ghcr.io/honeybee-studio/charts
  BUILD_CACHE: type=registry,ref=ghcr.io/honeybee-studio/honeybeepf-llm:buildcache

permissions:
  contents: read

# One release at a time, so two tags cannot race for the X.Y image tag.
concurrency:
  group: release

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Tag, agent crate and chart name one version
        id: check
        run: |
          version=$(bash ci/check-version.sh . "$GITHUB_REF_NAME")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GitHub Container Registry (helm)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io -u "$GHCR_USER" --password-stdin

      # Checked before anything is pushed, and only "not found" counts as free: a registry error must not
      # let a release be overwritten.
      - name: Image and chart version are not released yet
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          free() {
            local out
            if out=$("$@" 2>&1); then
              echo "::error::$VERSION is already released ($*); a release is never overwritten"
              return 1
            elif ! grep -qiE 'not found|manifest[ _]unknown|name[ _]unknown' <<<"$out"; then
              echo "::error::cannot tell whether $VERSION exists ($*): $out"
              return 1
            fi
          }
          free docker buildx imagetools inspect "$IMAGE:$VERSION"
          free helm show chart "$CHART_REPO/honeybeepf-llm" --version "$VERSION"

  image:
    name: Push image
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing: the job's OIDC token is the signing identity.
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          # latest stays the newest main build.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ env.BUILD_CACHE }}
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

  chart:
    name: Push chart
    needs: [version, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io -u "$GHCR_USER" --password-stdin

      # cosign reads the Docker credentials, not helm's, to upload the chart's signature.
      - name: Log in to GitHub Container Registry (cosign)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Package, push and sign chart
        run: |
          helm package charts/honeybeepf-llm --version "$VERSION" --app-version "$VERSION"
          helm push "honeybeepf-llm-$VERSION.tgz" "$CHART_REPO" 2>&1 | tee push.log
          digest=$(sed -n 's/^Digest: //p' push.log)
          test -n "$digest"
          cosign sign --yes "${CHART_REPO#oci://}/honeybeepf-llm@$digest"

      - name: Install oras
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      # Rewritten on every release; it holds no version, so overwriting it is safe.
      - name: Push Artifact Hub metadata
        working-directory: charts
        run: |
          oras push "${CHART_REPO#oci://}/honeybeepf-llm:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

  # Host binaries for running without Kubernetes, linked against glibc 2.28 so they run on RHEL 8 and every newer
  # distribution. The toolchain and bpf-linker are the ones the kernel matrix tests the agent with.
  binaries:
    name: Binary (${{ matrix.arch }})
    needs: version
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      # Keyless cosign signs each archive with the job's OIDC token.
      id-token: write
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            target: aarch64-unknown-linux-gnu
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCH: ${{ matrix.arch }}
      TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-04-30
          components: rust-src
          targets: ${{ matrix.target }}

      - name: Install bpf-linker, zig and cargo-zigbuild
        run: |
          cargo install bpf-linker --locked --version 0.10.3
          cargo install cargo-zigbuild --locked --version 0.24.0
          python3 -m pip install --user ziglang==0.14.1

      - name: Build
        working-directory: honeybeepf-llm
        run: cargo zigbuild --release -p honeybeepf-llm --target "$TARGET.2.28"

      - name: Check the glibc it needs
        run: |
          bin=honeybeepf-llm/target/$TARGET/release/honeybeepf-llm
          need=$(objdump -T "$bin" | grep -oE 'GLIBC_[0-9.]+' | sort -V | tail -1)
          echo "needs $need"
          [ "$need" = GLIBC_2.28 ] || { echo "::error::$bin needs $need, not GLIBC_2.28"; exit 1; }

      - name: Package
        run: |
          name="honeybeepf-llm-$VERSION-linux-$ARCH"
          mkdir -p "dist/$name"
          install -m 0755 "honeybeepf-llm/target/$TARGET/release/honeybeepf-llm" "dist/$name/"
          cp LICENSE NOTICE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign
        run: |
          name="honeybeepf-llm-$VERSION-linux-$ARCH.tar.gz"
          cosign sign-blob --yes --bundle "dist/$name.sigstore.json" "dist/$name"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binary-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.sigstore.json
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [version, image, chart, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Create release with generated notes
        run: |
          printf '%s\n' \
            "Image: \`$IMAGE:$VERSION\` (also \`${VERSION%.*}\`), linux/amd64 and linux/arm64" \
            "" \
            "Chart: \`helm install honeybeepf-llm $CHART_REPO/honeybeepf-llm --version $VERSION\`" \
            "" \
            "Binaries for running without Kubernetes: \`honeybeepf-llm-$VERSION-linux-amd64.tar.gz\` and \`-arm64\`, glibc 2.28 or later" \
            "" \
            "The image, the chart and the binaries are signed with keyless cosign; see docs/verify.md to verify them." >notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "honeybeepf-llm $VERSION" --notes-file notes.md --generate-notes dist/*
