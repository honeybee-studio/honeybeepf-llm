services:
  mock-llm:
    build:
      context: .
      dockerfile: Dockerfile.mock
    ports:
      - "8443:8443"
    environment:
      - MOCK_RESPONSE_DELAY_MS=50
      - MOCK_COMPLETION_TOKENS=30
    healthcheck:
      test: ["CMD", "python", "-c",
        "import urllib.request, ssl; ctx=ssl._create_unverified_context(); urllib.request.urlopen('https://localhost:8443/health', context=ctx)"]
      interval: 2s
      timeout: 2s
      retries: 5

  litellm:
    image: ghcr.io/berriai/litellm:main-v1.53.7-stable
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "4"]
    depends_on:
      mock-llm:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      - LITELLM_LOG=ERROR
      - OTEL_EXPORTER=otlp_grpc
      - OTEL_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=litellm
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 2s
      timeout: 3s
      retries: 5
      start_period: 30s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml
      - ./otel-output:/output
    ports:
      - "4317:4317"
